model:
  provider: local-agent30b64
  default: qwen3-30b-agent64

providers:
  local-agent30b64:
    api: http://127.0.0.1:8090/v1
    default_model: qwen3-30b-agent64
    discover_models: false
    models:
      qwen3-30b-agent64:
        context_length: 65536
        max_tokens: 8192
    name: Local Qwen3 30B Agent 64K

toolsets: [terminal, file]

agent:
  max_turns: 40
  gateway_timeout: 900
  reasoning_effort: none

display:
  streaming: false
  tool_progress: off
