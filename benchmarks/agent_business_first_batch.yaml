  audience: "本地通勤者、周末游客、带老人或儿童出行的家庭"
  business_goal: "用可信实用的服务内容提高文章完成阅读和后续关注，不以夸张标题换短期点击。"

source_facts:
  - "澄湾市夜游公交于9月5日开始试运营，试运营期8周。"
  - "线路为N1和N2两条。"
  - "运营时间为每周五、周六19:00至24:00。"
  - "单程票价2元。"
  - "持同一乘车码，60分钟内在N1与N2之间换乘不重复计费。"
  - "覆盖火车站、老街、滨水艺术中心三个主要区域。"
  - "车辆为低地板车型，设置轮椅停放区。"
  - "乘客可在官方小程序查看车辆位置和车厢拥挤度。"
  - "运营方将在试运营第四周根据客流和意见调整班次。"

editor_feedback:
  - "删除空泛的城市夜色抒情开头，前两段直接回答什么时候、去哪、多少钱。"
  - "突出这是8周试运营，不得写成永久服务。"
  - "增加家庭与行动不便乘客需要的无障碍和拥挤度信息。"
  - "结尾改成出发前检查清单。"

